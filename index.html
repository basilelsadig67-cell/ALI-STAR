<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* تثبيت الخلفية ومنع أي حركة غير مقصودة للشاشة بالكامل */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            overflow: hidden;
            position: fixed;
        }
        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 340px;
        }
        .login-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            outline: none;
            -webkit-appearance: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:active {
            background-color: #0056b3;
        }
        #error-msg {
            color: #dc3545;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h2>تسجيل الدخول</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" autocomplete="off" autocapitalize="off" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" autocomplete="off" required>
                </div>
                <button type="submit">دخول</button>
                <div id="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const enteredUser = usernameInput.value.trim();
            const enteredPass = passwordInput.value.trim();

            if (enteredUser === 'ALI' && enteredPass === '67678') {
                window.location.href = 'ALISTAR.html';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
